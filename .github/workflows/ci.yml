name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig fmt --check
        run: zig fmt --check .
      # The provider host tool (labelle-cli#405): the vendored wire decoder
      # and its fixtures, the providers/android.json schema, the invocation
      # matrix and doctor against a fake ANDROID_HOME. Windows included: the
      # tool names SDK tools `.exe`/`.bat` there.
      - name: Build and test the provider tool
        run: zig build install-provider test-provider --summary all
      # labelle-cli#446: the built tool's stdout+stderr redirected to one FILE
      # the "CLI" already wrote to must append, not overwrite from offset 0.
      # Python hands the file over the way a shell redirect does on every OS
      # (shared file pointer); see the script for why it isn't a Zig harness.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Redirected stdio appends (labelle-cli#446)
        shell: bash
        run: |
          tool=zig-out/bin/labelle-android
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          python tests/provider/stdio_e2e.py --tool "$tool"
      # The intent allow-list / decision tests, the video `yuv`/`planes`
      # helpers and the NDK-selection rule run on the host; no JNI or NDK needed.
      - name: Run unit tests
        if: runner.os != 'Windows'
        run: zig build test --summary all

  android-compile-check:
    name: Android compile-check (aarch64-linux-android, NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      # Compiles the three JNI C TUs against the NDK sysroot and the module's
      # `extern "c"` / AAudio / MediaCodec bindings for aarch64 (object
      # emission; nothing runs).
      - name: Cross-build for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: zig build test -Dtarget=aarch64-linux-android --summary all
      # labelle-android#10: 32-bit Android (armeabi-v7a) is unsupported. The
      # build must fail with the clear 64-bit-only message, not atomics errors.
      - name: 32-bit Android fails with the unsupported-ABI message
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          if zig build test -Dtarget=arm-linux-androideabi --summary all > armv7.log 2>&1; then
            cat armv7.log
            echo "expected the 32-bit Android build to fail"
            exit 1
          fi
          cat armv7.log
          grep -q "supports 64-bit Android only" armv7.log
          if grep -q "expected 32-bit integer type or smaller" armv7.log; then
            echo "atomics errors leaked past the unsupported-ABI guard"
            exit 1
          fi

  # The provider through the real labelle-cli, on every host: discovery from a
  # fixture project's `local:` pin, the `zig build --system install-provider`
  # build, the contract 1.2.0 context, `labelle help`/`android doctor`, and
  # the packaging hooks and commands (`labelle build|run|bundle
  # --platform=android`, `labelle android run|deploy`) against a fake SDK
  # whose tools log their argv (tests/provider/stub_tool.zig).
  provider:
    name: Provider e2e, fake SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # labelle-cli `main` at the merge of PR #487 (cli#443): contract 1.4.0
      # (`final_step`), no reserved `android` namespace, no built-in Android
      # code, and `labelle doctor --json` aggregates provider doctors (the e2e
      # asserts it; --require-doctor-aggregation makes a skip fatal).
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: d7827ebec1b936ad953ae1893a797ad115e791af
          path: .test-cli
          persist-credentials: false
      - run: zig build
        working-directory: .test-cli
      - name: Exercise discovery, dispatch, packaging, run and bundle
        shell: bash
        run: |
          zig_bin="$(command -v zig)"
          cli_bin=.test-cli/zig-out/bin/labelle
          if [ "$RUNNER_OS" = Windows ]; then
            zig_bin="$(cygpath -w "$zig_bin")"
            cli_bin="$cli_bin.exe"
          fi
          python tests/provider/e2e.py --cli "$cli_bin" --zig "$zig_bin" --require-doctor-aggregation

  # A real APK: the pinned CLI, the released assembler and bgfx backend, the
  # NDK and the SDK build-tools package a tiny bgfx project through this
  # provider; apksigner verifies it, `aapt dump badging` and `unzip -Zv`
  # check its identity and layout (tests/provider/ndk_e2e.py).
  provider-ndk:
    name: Provider e2e, real NDK/SDK (bgfx fixture APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # `packages`: the action's default still names the retired `tools`.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install platform 34, build-tools and NDK r27c
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      # The same labelle-cli pin as the provider job (#487 merged).
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: d7827ebec1b936ad953ae1893a797ad115e791af
          path: .test-cli
          persist-credentials: false
      - run: zig build
        working-directory: .test-cli
      # The fixture's backend, unmodified. From v0.30.0 bgfx's build hook
      # points its labelle_android imports at the `android` plugin's module,
      # so the link sees ONE copy of the JNI C (#405 D11); ndk_e2e.py checks
      # it is the plugin's.
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-bgfx
          ref: v0.30.0
          path: .test-bgfx
          persist-credentials: false
      - name: Bundle, verify and inspect the fixture APK
        run: python tests/provider/ndk_e2e.py --cli .test-cli/zig-out/bin/labelle --bgfx .test-bgfx
